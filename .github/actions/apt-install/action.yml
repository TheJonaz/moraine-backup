name: apt install
description: >
  Install packages from Ubuntu's archive, after dropping the apt sources the
  runner image adds for other vendors.

# Every apt step in this repository installs from Ubuntu's archive and nothing
# else, but the runner image also configures Microsoft and Google repositories.
# `apt-get update` reports failure if *any* configured source fails, so an
# outage on a repository we do not use fails a job that only wanted libgtk-4-dev
# — as happened on 2026-08-05, when packages.microsoft.com answered 403 and the
# lint job died with exit 100.
#
# The sources are dropped by what they point at rather than by filename, since
# the filenames move between image versions.

inputs:
  packages:
    description: Space-separated package names.
    required: true
  no-install-recommends:
    description: Skip recommended packages.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        shopt -s nullglob
        for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
          # Ubuntu's own archive appears under several hostnames — archive,
          # azure.archive, ports for arm64 — all under ubuntu.com. Anything
          # else is a vendor repository this job has no use for.
          if ! grep -q 'ubuntu\.com' "$source"; then
            echo "dropping $source"
            sudo rm -f "$source"
          fi
        done

        recommends=''
        if [ '${{ inputs.no-install-recommends }}' = 'true' ]; then
          recommends='--no-install-recommends'
        fi

        sudo apt-get update
        # shellcheck disable=SC2086  # both are deliberately word-split
        sudo apt-get install -y $recommends ${{ inputs.packages }}

name: moraine
title: Moraine
base: core24
version: '0.2.2'
summary: Snapshot backups over SSH/rsync and rclone
license: MIT
contact: info@thern.io
issues: https://github.com/TheJonaz/moraine-backup/issues
source-code: https://github.com/TheJonaz/moraine-backup
website: https://moraine.thern.io
description: |
  Moraine takes hard-linked snapshots of your files to a NAS or server over
  SSH, or to cloud/FTP/SMB/WebDAV/S3/Drive storage via rclone. Every run becomes
  its own timestamped snapshot where unchanged files share storage, so you keep
  full history at almost no extra disk cost. Restore whole snapshots or single
  files, schedule runs from cron, and prune old snapshots with a retention
  policy.

  This snap ships the **command-line client only**. The GTK desktop app is
  distributed as a Flatpak, an AppImage and a .deb instead — see
  https://moraine.thern.io/distribution.html

  rsync, the OpenSSH client and rclone are bundled, so every backend works
  without installing anything else.

grade: stable

# Classic, not strict — and not for convenience.
#
# A backup tool has to read whatever paths the user points it at. Under strict
# confinement the `home` interface grants "access to non-hidden files in the
# home directory": snapd's AppArmor rule is `owner @{HOME}/[^s.]** rwkl`, which
# excludes every top-level dotfile. Six of the eleven locations `moraine
# recommend` suggests on Linux are exactly that — ~/.config, ~/.mozilla,
# ~/.thunderbird, ~/.gitconfig, ~/.ssh, ~/.gnupg — i.e. the configuration and
# keys a backup exists for, while the five that would work are re-downloadable
# media.
#
# `personal-files` cannot close the gap either: it declares *named* paths and
# needs a store request per path, whereas the set here is whatever the user
# chooses. Scheduling writes to crontab, which strict confinement also denies.
#
# Classic requires manual store review. See README.md for the request text.
confinement: classic
compression: lzo

apps:
  moraine:
    command: bin/moraine
    # A classic snap runs with the host's environment, so unlike a strict one it
    # does NOT get $SNAP/usr/bin prepended for free. Without this, moraine would
    # shell out to whatever rsync/ssh/rclone the host happens to have — or fail
    # on a host with no rclone at all — and the bundled copies would be dead
    # weight. Host tools still win nothing: ours come first deliberately, so the
    # snap behaves the same everywhere.
    environment:
      PATH: $SNAP/usr/bin:$SNAP/bin:$PATH

parts:
  moraine:
    plugin: rust
    source: https://github.com/TheJonaz/moraine-backup.git
    source-tag: v0.2.2
    # Classic snaps get no snap-specific library paths at runtime, so staged
    # binaries must be patched to find the libraries shipped alongside them
    # rather than whatever the host happens to have.
    build-attributes: [enable-patchelf]
    build-packages:
      - pkg-config
    stage-packages:
      - rsync
      - openssh-client
      - rclone
    override-build: |
      # CLI only: --no-default-features drops the GTK app (and with it the
      # keyring feature, which wants a desktop session this snap has no use for
      # — scheduled runs read their secrets from the config or the environment).
      cargo build --release --locked --no-default-features --bin moraine
      install -Dm755 target/release/moraine "$CRAFT_PART_INSTALL/bin/moraine"
      install -Dm644 man/moraine.1 \
        "$CRAFT_PART_INSTALL/usr/share/man/man1/moraine.1"
